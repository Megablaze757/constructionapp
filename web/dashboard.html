<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dashboard — BuilderOS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script src="config.js"></script>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <h1>BuilderOS Command Centre</h1>
    <button class="btn btn-sm" id="refresh-btn" type="button">🔄 Refresh</button>
  </div>

  <div id="banner"></div>

  <!-- Key Metrics Summary -->
  <div class="card">
    <h2>📊 Business Health</h2>
    <div class="card-body">
      <div class="tiles" id="tiles"><span class="muted">Loading financial &amp; job metrics…</span></div>
    </div>
  </div>

  <!-- Needs Your Decision -->
  <div class="card" id="decisions-card" hidden>
    <h2>⚠️ Needs Your Decision</h2>
    <div class="card-body" id="decisions"></div>
  </div>

  <!-- At-Risk Jobs -->
  <div class="card" id="risk-card" hidden>
    <h2>🚨 At-Risk Jobs</h2>
    <div class="card-body" id="risks"></div>
  </div>

  <!-- Jobs Running -->
  <div class="card">
    <h2>🏗️ Active Jobs</h2>
    <div class="card-body" id="jobs"></div>
  </div>

  <!-- Cash & Invoicing -->
  <div class="card">
    <h2>💷 Cash Flow <a class="btn btn-sm" href="cash.html">Details →</a></h2>
    <div class="card-body" id="cash"></div>
  </div>

  <!-- Margin Health -->
  <div class="card">
    <h2>📈 Live Margin Health <a class="btn btn-sm" href="variance.html">Variance →</a></h2>
    <div class="card-body" id="margin"></div>
  </div>

  <!-- Team Reliability -->
  <div class="card">
    <h2>👷 Crew Reliability <a class="btn btn-sm" href="team.html">Team →</a></h2>
    <div class="card-body" id="reliability"></div>
  </div>
</div>

<!-- Bottom Navigation Bar for UK Builders on Site -->
<nav class="bottom-nav" aria-label="Mobile Navigation">
  <a href="dashboard.html" class="active"><span class="bottom-nav-icon">📊</span>Dashboard</a>
  <a href="index.html"><span class="bottom-nav-icon">📋</span>Quotes</a>
  <a href="jobs.html"><span class="bottom-nav-icon">🏗️</span>Jobs</a>
  <a href="cash.html"><span class="bottom-nav-icon">💷</span>Cash</a>
  <a href="sops.html"><span class="bottom-nav-icon">✅</span>SOPs</a>
</nav>

<script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
