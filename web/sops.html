<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a56db">
<title>SOPs — BuilderOS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script src="config.js"></script>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <a class="back" href="index.html" aria-label="Back to quotes">←</a>
    <h1>SOPs</h1>
    <button class="btn btn-sm btn-primary" id="add-btn" type="button">+ New</button>
  </div>

  <div id="banner"></div>

  <div class="card">
    <div class="card-body">
      <p class="muted" style="margin:0">
        How this business does a thing, written down once. Attach a checklist to a
        job and the crew works through it — steps marked 📷 need a photo before
        they count as done.
      </p>
    </div>
  </div>

  <div id="sop-list"><div class="card"><div class="card-body muted">Loading…</div></div></div>
</div>

<dialog id="sop-dialog">
  <form method="dialog" class="card-body">
    <h2>New SOP</h2>
    <label>Title
      <input type="text" id="s-title" placeholder="e.g. Scaffold dismantle check" autocomplete="off">
    </label>
    <label>Category
      <input type="text" id="s-category" placeholder="e.g. safety" autocomplete="off">
    </label>
    <label>Steps — one per line. Start a line with * if it needs a photo.
      <textarea id="s-steps" rows="8" placeholder="Check the ties are still secure
* Photograph the base plates
Sign the scafftag"></textarea>
    </label>
    <div class="btn-row">
      <button class="btn" value="cancel" type="submit">Cancel</button>
      <button class="btn btn-primary" value="save" type="submit">Save SOP</button>
    </div>
  </form>
</dialog>

<script type="module" src="assets/js/sops.js"></script>
</body>
</html>
