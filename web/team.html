<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a56db">
<title>Team — BuilderOS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script src="config.js"></script>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <a class="back" href="index.html" aria-label="Back to quotes">←</a>
    <h1>Team</h1>
    <button class="btn btn-sm btn-primary" id="add-btn" type="button">+ Add</button>
  </div>

  <div id="banner"></div>

  <div class="card">
    <h2>Staff</h2>
    <div class="lines" id="staff"></div>
  </div>

  <div class="card">
    <h2>Subcontractors</h2>
    <div class="lines" id="subs"></div>
  </div>

  <div class="card">
    <div class="card-body">
      <label class="inline-check">
        <input type="checkbox" id="show-inactive">
        <span>Show people who have left</span>
      </label>
    </div>
  </div>
</div>

<dialog id="person-dialog">
  <form method="dialog" class="card-body">
    <h2 id="person-title">Add someone</h2>
    <label>Name
      <input type="text" id="p-name" autocomplete="off">
    </label>
    <label>Staff or subcontractor
      <select id="p-kind">
        <option value="staff">Staff</option>
        <option value="subcontractor">Subcontractor</option>
      </select>
    </label>
    <label>Trade
      <input type="text" id="p-trade" placeholder="e.g. scaffolder" autocomplete="off">
    </label>
    <label>Role
      <input type="text" id="p-role" placeholder="e.g. site lead" autocomplete="off">
    </label>
    <label>Phone
      <input type="text" id="p-phone" autocomplete="off" inputmode="tel">
    </label>
    <label>Day rate (£, what they cost you)
      <input type="number" id="p-rate" min="0" step="0.01" inputmode="decimal">
    </label>
    <div class="btn-row">
      <button class="btn" value="cancel" type="submit">Cancel</button>
      <button class="btn btn-primary" value="save" type="submit">Save</button>
    </div>
    <button class="btn btn-danger" id="p-deactivate" value="deactivate" type="submit" hidden>
      Mark as left
    </button>
  </form>
</dialog>

<script type="module" src="assets/js/team.js"></script>
</body>
</html>
