name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow one concurrent deployment, letting an in-progress run finish so a
# half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the frontend at whatever has been deployed
        env:
          API_BASE: ${{ vars.API_BASE }}
          AI_BASE: ${{ vars.AI_BASE }}
          BUSINESS_NAME: ${{ vars.BUSINESS_NAME }}
        run: |
          AI_BASE="${AI_BASE:-https://construction.fitnessguru.workers.dev}"
          {
            echo "window.BUILDEROS_CONFIG = {"
            echo "  apiBase: '${API_BASE}',"
            echo "  aiBase: '${AI_BASE}',"
            echo "  businessName: '${BUSINESS_NAME:-Builder Co.}',"
            echo "};"
          } > web/config.js
          if [ -z "$API_BASE" ]; then
            echo "::notice::API_BASE unset — quotes stay on-device; AI drafts go to ${AI_BASE}."
          fi
          cat web/config.js
          touch web/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
