name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow one concurrent deployment, letting an in-progress run finish so a
# half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Point the frontend at whatever has been deployed
        env:
          API_BASE: ${{ vars.API_BASE }}
          AI_BASE: ${{ vars.AI_BASE }}
          BUSINESS_NAME: ${{ vars.BUSINESS_NAME }}
          BUSINESS_PHONE: ${{ vars.BUSINESS_PHONE }}
        run: |
          # No hardcoded fallback. Pointing the site at an AI worker that is not
          # configured is worse than pointing it at none: every draft and every
          # voice note pays a failed round trip before falling back to the free
          # rung, and the owner reads an error about a worker they never set up.
          # Set the AI_BASE repository variable when you have one that answers.
          {
            echo "window.BUILDEROS_CONFIG = {"
            echo "  apiBase: '${API_BASE}',"
            echo "  aiBase: '${AI_BASE}',"
            echo "  businessName: '${BUSINESS_NAME:-Builder Co.}',"
            echo "  businessPhone: '${BUSINESS_PHONE}',"
            echo "};"
          } > web/config.js
          if [ -z "$API_BASE" ] && [ -z "$AI_BASE" ]; then
            echo "::notice::Neither API_BASE nor AI_BASE set — the site runs on-device, drafts from your wording, and transcribes voice notes in the browser. All free."
          elif [ -z "$API_BASE" ]; then
            echo "::notice::API_BASE unset — quotes stay on-device; AI drafting and transcription go to ${AI_BASE}."
          fi
          cat web/config.js
          touch web/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
